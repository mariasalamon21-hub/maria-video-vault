
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maria Video Vault</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .upload {
      background: #4285f4;
      color: white;
    }

    .delete {
      background: #d93025;
      color: white;
    }

    .video {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
    }

    #status {
      margin: 20px 0;
      white-space: pre-wrap;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎥 Maria Video Vault</h1>

  <div id="g_id_onload"
       data-client_id="687022968022-v5l47s84jtjgj0se3dp10b995t4q4doe.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"></div>

  <div id="app" style="display:none;">

    <h3>Upload Video</h3>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >

    <button class="upload" onclick="uploadVideo()">
      Upload Video
    </button>

    <div id="status"></div>

    <h3>Your Videos</h3>

    <div id="videoList"></div>

  </div>

<script>

const CLIENT_ID =
"687022968022-v5l47s84jtjgj0se3dp10b995t4q4doe.apps.googleusercontent.com";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive.file";

let accessToken = null;
let folderId = null;


/* =========================
   GOOGLE LOGIN
========================= */

function handleCredentialResponse(response) {

  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: DRIVE_SCOPE,

    callback: function(tokenResponse) {

      if (tokenResponse.error) {
        showStatus(
          "❌ Google login failed:\n" +
          JSON.stringify(tokenResponse, null, 2)
        );
        return;
      }

      accessToken = tokenResponse.access_token;

      document.getElementById("app").style.display = "block";

      showStatus("✅ Google connected.");

      startApp();
    }
  });

  client.requestAccessToken();
}


/* =========================
   START APP
========================= */

async function startApp() {

  try {

    folderId = await getOrCreateFolder();

    await listVideos();

  } catch (error) {

    showStatus(
      "❌ Could not start the app:\n\n" +
      error.message
    );

  }
}


/* =========================
   STATUS
========================= */

function showStatus(message) {

  document.getElementById("status").textContent = message;

}


/* =========================
   DRIVE API REQUEST
========================= */

async function driveRequest(url, options = {}) {

  options.headers = {

    ...(options.headers || {}),

    Authorization: "Bearer " + accessToken

  };

  const response = await fetch(url, options);

  const text = await response.text();

  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status +
      "\n" +
      text
    );

  }

  return text ? JSON.parse(text) : null;

}


/* =========================
   FIND / CREATE FOLDER
========================= */

async function getOrCreateFolder() {

  const query =
    "name = 'Maria Video Vault' " +
    "and mimeType = 'application/vnd.google-apps.folder' " +
    "and trashed = false";

  const searchUrl =
    "https://www.googleapis.com/drive/v3/files" +
    "?q=" + encodeURIComponent(query) +
    "&fields=files(id,name)";

  const result = await driveRequest(searchUrl);

  if (result.files && result.files.length > 0) {

    return result.files[0].id;

  }


  const folder = await driveRequest(
    "https://www.googleapis.com/drive/v3/files",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        name: "Maria Video Vault",

        mimeType:
          "application/vnd.google-apps.folder"

      })
    }
  );

  return folder.id;

}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo() {

  const input =
    document.getElementById("videoInput");

  if (!input.files.length) {

    alert("Choose a video first.");

    return;
  }

  const file = input.files[0];

  showStatus(
    "⏳ Starting upload...\n\n" +
    file.name
  );


  try {

    /* STEP 1 — CREATE RESUMABLE SESSION */

    const metadata = {

      name: file.name,

      mimeType: file.type || "video/mp4",

      parents: [folderId]

    };


    const initResponse = await fetch(

      "https://www.googleapis.com/upload/drive/v3/files" +
      "?uploadType=resumable",

      {

        method: "POST",

        headers: {

          Authorization:
            "Bearer " + accessToken,

          "Content-Type":
            "application/json; charset=UTF-8",

          "X-Upload-Content-Type":
            file.type || "video/mp4",

          "X-Upload-Content-Length":
            file.size.toString()

        },

        body: JSON.stringify(metadata)

      }

    );


    const initText =
      await initResponse.text();


    if (!initResponse.ok) {

      throw new Error(

        "Google rejected the upload session.\n\n" +

        "HTTP " +
        initResponse.status +

        "\n\n" +

        initText

      );

    }


    /* IMPORTANT:
       Google returns the resumable
       upload URL in Location.
    */

    const uploadUrl =
      initResponse.headers.get("Location");


    if (!uploadUrl) {

      throw new Error(

        "Google accepted the request but did not return " +
        "the resumable upload URL."

      );

    }


    /* STEP 2 — UPLOAD IN CHUNKS */

    const chunkSize =
      8 * 1024 * 1024;

    let start = 0;


    while (start < file.size) {

      const end =
        Math.min(
          start + chunkSize,
          file.size
        );

      const chunk =
        file.slice(start, end);


      showStatus(

        "⏳ Uploading...\n\n" +

        file.name +

        "\n\n" +

        Math.round(
          (end / file.size) * 100
        ) +

        "%"

      );


      const uploadResponse =
        await fetch(uploadUrl, {

          method: "PUT",

          headers: {

            Authorization:
              "Bearer " + accessToken,

            "Content-Length":
              chunk.size.toString(),

            "Content-Range":
              "bytes " +
              start +
              "-" +
              (end - 1) +
              "/" +
              file.size

          },

          body: chunk

        });


      if (

        uploadResponse.status !== 200 &&
        uploadResponse.status !== 201 &&
        uploadResponse.status !== 308

      ) {

        const errorText =
          await uploadResponse.text();

        throw new Error(

          "Upload failed.\n\n" +

          "HTTP " +
          uploadResponse.status +

          "\n\n" +

          errorText

        );

      }


      start = end;

    }


    showStatus(
      "✅ Upload completed successfully!"
    );


    input.value = "";

    await listVideos();


  } catch (error) {

    showStatus(

      "❌ Upload failed:\n\n" +

      error.message

    );

    console.error(error);

  }

}


/* =========================
   LIST VIDEOS
========================= */

async function listVideos() {

  const query =
    "'" +
    folderId +
    "' in parents " +
    "and trashed = false " +
    "and mimeType contains 'video/'";


  const url =
    "https://www.googleapis.com/drive/v3/files" +

    "?q=" +
    encodeURIComponent(query) +

    "&fields=files(id,name,size,webViewLink,createdTime)" +

    "&orderBy=createdTime desc";


  const result =
    await driveRequest(url);


  const list =
    document.getElementById("videoList");


  list.innerHTML = "";


  if (
    !result.files ||
    result.files.length === 0
  ) {

    list.innerHTML =
      "<p>No videos yet.</p>";

    return;

  }


  result.files.forEach(file => {

    const div =
      document.createElement("div");

    div.className = "video";


    const size =
      file.size
        ? formatSize(Number(file.size))
        : "";


    div.innerHTML = `

      <strong>${escapeHtml(file.name)}</strong>

      <br>

      ${size}

      <br><br>

      <button onclick="openVideo('${file.id}')">
        ▶️ Open
      </button>

      <button
        class="delete"
        onclick="deleteVideo('${file.id}')"
      >
        🗑️ Delete
      </button>

    `;


    list.appendChild(div);

  });

}


/* =========================
   OPEN VIDEO
========================= */

function openVideo(id) {

  window.open(

    "https://drive.google.com/file/d/" +
    id +
    "/view",

    "_blank"

  );

}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(id) {

  if (
    !confirm(
      "Delete this video permanently?"
    )
  ) {

    return;

  }


  try {

    await fetch(

      "https://www.googleapis.com/drive/v3/files/" +
      id,

      {

        method: "DELETE",

        headers: {

          Authorization:
            "Bearer " + accessToken

        }

      }

    );


    await listVideos();


    showStatus(
      "🗑️ Video deleted."
    );


  } catch (error) {

    showStatus(
      "❌ Delete failed:\n\n" +
      error.message
    );

  }

}


/* =========================
   HELPERS
========================= */

function formatSize(bytes) {

  if (bytes < 1024)
    return bytes + " B";

  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  if (bytes < 1024 * 1024 * 1024)
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";

  return (
    bytes /
    (1024 * 1024 * 1024)
  ).toFixed(2) + " GB";

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
