<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maria Video Vault</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    #uploadBtn {
      background: #222;
      color: white;
    }

    .video {
      padding: 12px;
      margin: 10px 0;
      background: #f1f1f1;
      border-radius: 10px;
    }

    .progress {
      width: 100%;
      height: 20px;
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #fileInput {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎥 Maria Video Vault</h1>

  <div id="loginSection">
    <p>Sign in with your Google account to access your videos.</p>

    <div id="g_id_onload"
         data-client_id="687022968022-v5l47s84jtjgj0se3dp10b995t4q4doe.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline">
    </div>
  </div>

  <div id="app" style="display:none;">

    <p id="userInfo"></p>

    <input type="file" id="fileInput" accept="video/*">

    <br>

    <button id="uploadBtn">Upload Video</button>

    <progress id="progress" class="progress" value="0" max="100"></progress>

    <div id="status"></div>

    <hr>

    <h2>My Videos</h2>

    <button onclick="loadVideos()">🔄 Refresh</button>

    <div id="videoList"></div>

  </div>

</div>

<script>

const CLIENT_ID = "687022968022-v5l47s84jtjgj0se3dp10b995t4q4doe.apps.googleusercontent.com";

const SCOPES =
  "https://www.googleapis.com/auth/drive.file";

let accessToken = null;
let folderId = null;


/* =========================
   GOOGLE LOGIN
========================= */

function handleCredentialResponse(response) {

  // Decode Google login response
  const data = JSON.parse(
    atob(
      response.credential.split('.')[1]
        .replace(/-/g, '+')
        .replace(/_/g, '/')
    )
  );

  document.getElementById("userInfo").textContent =
    "Logged in as: " + data.email;

  // Ask Google for Drive permission
  requestDriveAccess();
}


function requestDriveAccess() {

  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,

    callback: function(response) {

      if (response.error) {
        document.getElementById("status").textContent =
          "Google Drive permission was not granted.";
        return;
      }

      accessToken = response.access_token;

      document.getElementById("loginSection").style.display = "none";
      document.getElementById("app").style.display = "block";

      document.getElementById("status").textContent =
        "Connected to Google Drive.";

      initializeDrive();
    }
  });

  tokenClient.requestAccessToken({
    prompt: "consent"
  });
}


/* =========================
   DRIVE FOLDER
========================= */

async function initializeDrive() {

  try {

    const query =
      "name = 'Maria Video Vault' " +
      "and mimeType = 'application/vnd.google-apps.folder' " +
      "and trashed = false";

    const response = await fetch(
      "https://www.googleapis.com/drive/v3/files?" +
      new URLSearchParams({
        q: query,
        fields: "files(id,name)",
        spaces: "drive"
      }),
      {
        headers: {
          Authorization: "Bearer " + accessToken
        }
      }
    );

    const data = await response.json();

    if (data.files && data.files.length > 0) {

      folderId = data.files[0].id;

    } else {

      const createResponse = await fetch(
        "https://www.googleapis.com/drive/v3/files",
        {
          method: "POST",

          headers: {
            Authorization: "Bearer " + accessToken,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name: "Maria Video Vault",
            mimeType: "application/vnd.google-apps.folder"
          })
        }
      );

      const folder = await createResponse.json();

      folderId = folder.id;
    }

    loadVideos();

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Could not connect to Google Drive.";
  }
}


/* =========================
   UPLOAD
========================= */

document.getElementById("uploadBtn").onclick =
  uploadVideo;


async function uploadVideo() {

  const input = document.getElementById("fileInput");

  if (!input.files.length) {

    alert("Choose a video first.");
    return;
  }

  const file = input.files[0];

  if (!accessToken || !folderId) {

    alert("Please sign in first.");
    return;
  }

  const status =
    document.getElementById("status");

  const progress =
    document.getElementById("progress");

  status.textContent =
    "Starting upload...";

  progress.value = 0;

  try {

    /* Create resumable upload session */

    const metadata = {

      name: file.name,

      mimeType: file.type || "video/mp4",

      parents: [folderId]
    };

    const sessionResponse = await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",
      {
        method: "POST",

        headers: {

          Authorization:
            "Bearer " + accessToken,

          "Content-Type":
            "application/json",

          "X-Upload-Content-Type":
            file.type || "application/octet-stream",

          "X-Upload-Content-Length":
            file.size
        },

        body: JSON.stringify(metadata)
      }
    );

    const uploadUrl =
      sessionResponse.headers.get("Location");

    if (!uploadUrl) {

      throw new Error(
        "Could not create upload session."
      );
    }


    /* Upload in 8 MB chunks */

    const chunkSize =
      8 * 1024 * 1024;

    let start = 0;

    while (start < file.size) {

      const end =
        Math.min(
          start + chunkSize,
          file.size
        );

      const chunk =
        file.slice(start, end);

      const response =
        await fetch(uploadUrl, {

          method: "PUT",

          headers: {

            "Content-Length":
              chunk.size,

            "Content-Range":
              `bytes ${start}-${end - 1}/${file.size}`
          },

          body: chunk
        });


      if (
        response.status === 200 ||
        response.status === 201
      ) {

        progress.value = 100;

        status.textContent =
          "✅ Upload complete!";

        break;
      }

      if (response.status === 308) {

        const range =
          response.headers.get("Range");

        if (range) {

          start =
            parseInt(
              range.split("-")[1]
            ) + 1;

        } else {

          start = end;
        }

        const percent =
          Math.floor(
            (start / file.size) * 100
          );

        progress.value =
          percent;

        status.textContent =
          `Uploading... ${percent}%`;

      } else {

        const errorText =
          await response.text();

        throw new Error(errorText);
      }
    }

    loadVideos();

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Upload failed: " +
      error.message;
  }
}


/* =========================
   LIST VIDEOS
========================= */

async function loadVideos() {

  if (!accessToken || !folderId)
    return;

  const list =
    document.getElementById("videoList");

  list.innerHTML =
    "Loading videos...";

  try {

    const query =
      `'${folderId}' in parents ` +
      `and trashed = false ` +
      `and mimeType contains 'video/'`;

    const response =
      await fetch(
        "https://www.googleapis.com/drive/v3/files?" +
        new URLSearchParams({

          q: query,

          fields:
            "files(id,name,size,webViewLink,createdTime)",

          orderBy:
            "createdTime desc"
        }),

        {
          headers: {
            Authorization:
              "Bearer " + accessToken
          }
        }
      );

    const data =
      await response.json();

    list.innerHTML = "";

    if (
      !data.files ||
      data.files.length === 0
    ) {

      list.innerHTML =
        "<p>No videos yet.</p>";

      return;
    }


    data.files.forEach(file => {

      const div =
        document.createElement("div");

      div.className =
        "video";

      const size =
        file.size
          ? formatBytes(file.size)
          : "";

      div.innerHTML = `

        <strong>${escapeHtml(file.name)}</strong>

        <br>

        <small>${size}</small>

        <br>

        <button
          onclick="openVideo('${file.id}')">
          ▶ Open
        </button>

        <button
          onclick="deleteVideo('${file.id}')">
          🗑 Delete
        </button>
      `;

      list.appendChild(div);
    });

  } catch (error) {

    console.error(error);

    list.innerHTML =
      "Could not load videos.";
  }
}


/* =========================
   OPEN VIDEO
========================= */

async function openVideo(fileId) {

  const url =
    `https://drive.google.com/file/d/${fileId}/view`;

  window.open(url, "_blank");
}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(fileId) {

  if (
    !confirm(
      "Delete this video from Google Drive?"
    )
  ) {
    return;
  }

  try {

    await fetch(
      `https://www.googleapis.com/drive/v3/files/${fileId}`,
      {
        method: "DELETE",

        headers: {
          Authorization:
            "Bearer " + accessToken
        }
      }
    );

    loadVideos();

  } catch (error) {

    console.error(error);

    alert(
      "Could not delete the video."
    );
  }
}


/* =========================
   HELPERS
========================= */

function formatBytes(bytes) {

  if (!bytes) return "";

  const units =
    ["Bytes", "KB", "MB", "GB", "TB"];

  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (bytes / Math.pow(1024, i))
      .toFixed(2)
    + " "
    + units[i]
  );
}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
