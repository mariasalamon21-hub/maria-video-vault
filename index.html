const FOLDER_NAME =

===================================================== */

function googleLogin(response) {

  statusBox.textContent =
    "Connecting to Google Drive...";

  const tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: DRIVE_SCOPE,

      callback: async function(tokenResponse) {

        if (tokenResponse.error) {

          showError(
            "Google authorization failed: " +

        }

        accessToken =
          tokenResponse.access_token;

        loginSection.style.display =

        app.style.display =

        statusBox.textContent =
          "Connected to Google Drive.";

        }

      }

    });

    prompt: "consent"
  });

/* =====================================================
   GET / CREATE FOLDER
===================================================== */

async function getOrCreateFolder() {

  const query =
    "name = '" +
    FOLDER_NAME +
    "' " +
    "and mimeType = 'application/vnd.google-apps.folder' " +
    "and trashed = false";

  const url =
    "https://www.googleapis.com/drive/v3/files?" +
    new URLSearchParams({

      q: query,

      spaces: "drive",

      fields: "files(id,name)"

    });


  const response =
    await fetch(url, {

      headers: {
        Authorization:
          "Bearer " + accessToken
      }

    });


  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      "Folder search failed (" +
      response.status +
      "): " +
      text
    );
  }


  const data =
    await response.json();


  if (
    data.files &&
    data.files.length > 0
  ) {

    folderId =
      data.files[0].id;

    return;
  }


  /* CREATE FOLDER */

  const createResponse =
    await fetch(
      "https://www.googleapis.com/drive/v3/files",
      {

        method: "POST",

        headers: {

          Authorization:
            "Bearer " + accessToken,

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          name:
            FOLDER_NAME,

          mimeType:
            "application/vnd.google-apps.folder"

        })

      }
    );


  if (!createResponse.ok) {

    const text =
      await createResponse.text();

    throw new Error(
      "Could not create folder (" +
      createResponse.status +
      "): " +
      text
    );
  }


  const folder =
    await createResponse.json();

  folderId =
    folder.id;
}
